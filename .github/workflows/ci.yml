name: FaculFlow CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        
    - name: Run Django Tests
      env:
        SECRET_KEY: 'test-key-not-for-production'
        DEBUG: 'True'
        DATABASE_URL: 'sqlite:///db.sqlite3'
      run: |
        cd backend
        python manage.py test
        
    - name: Run Antigravity Quality Checklist
      run: |
        python .agent/scripts/checklist.py .
        
  frontend-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'
        
    - name: Install dependencies
      run: |
        cd frontend/faculflow-app
        npm ci
        
    - name: Run Type Check (if applicable)
      run: |
        # cd frontend/faculflow-app && npx tsc --noEmit
        echo "No TypeScript config found yet, skipping typecheck."
